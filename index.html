<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Care</title>
<meta name="description" content="A daily health routine: schedule, water, meals, skincare, sleep and progress.">
<meta name="theme-color" content="#edf1f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1514" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Care">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<style>
@font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}

:root{
  --bg:#edf1f1; --surface:#ffffff; --ink:#0f1b19; --ink2:#43554f; --muted:#62736d;
  --line:#d2dcd8; --line2:#e3eae7;
  --green:#187a4f; --green-soft:#daf0e4; --green-deep:#0f5c3a; --on-green:#ffffff;
  --orange:#c9560f; --orange-soft:#fde8da; --orange-deep:#8f3a08;
  --blue:#2a6fc9; --blue-soft:#e0ebfa; --blue-deep:#1c56a3;
  --violet:#6d4fc4; --violet-soft:#ece6fa; --violet-deep:#4e3496;
  --water:#0f8fa3; --water-soft:#d9f0f4;
  --danger:#b93030;
  --shadow:0 1px 2px rgba(15,27,25,.06),0 10px 28px rgba(15,27,25,.07);
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1514; --surface:#151f1d; --ink:#e9f1ee; --ink2:#a8b9b3; --muted:#8a9c96;
    --line:#26332f; --line2:#1e2a27;
    --green:#3cbf85; --green-soft:#153a2a; --green-deep:#7fe0b3; --on-green:#052318;
    --orange:#e8763a; --orange-soft:#3a2114; --orange-deep:#f4a97c;
    --blue:#4b93ea; --blue-soft:#152f4f; --blue-deep:#8fbcf2;
    --violet:#8f76e0; --violet-soft:#29214d; --violet-deep:#b9a7f0;
    --water:#38b8cc; --water-soft:#123840;
    --danger:#ef7373;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1514; --surface:#151f1d; --ink:#e9f1ee; --ink2:#a8b9b3; --muted:#8a9c96;
  --line:#26332f; --line2:#1e2a27;
  --green:#3cbf85; --green-soft:#153a2a; --green-deep:#7fe0b3; --on-green:#052318;
  --orange:#e8763a; --orange-soft:#3a2114; --orange-deep:#f4a97c;
  --blue:#4b93ea; --blue-soft:#152f4f; --blue-deep:#8fbcf2;
  --violet:#8f76e0; --violet-soft:#29214d; --violet-deep:#b9a7f0;
  --water:#38b8cc; --water-soft:#123840;
  --danger:#ef7373;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);padding-inline:16px;padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,p,ul,ol{margin:0;padding:0}
ul,ol{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 14px}
.eyebrow{font:600 12px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.top h1{font:700 38px/.95 var(--display);letter-spacing:.01em;text-transform:uppercase}
.bib{font:700 20px/1 var(--display);letter-spacing:.06em;border:2px solid var(--ink);border-radius:5px;padding:6px 9px 5px;white-space:nowrap;text-transform:uppercase}
.bib small{font:600 11px/1 var(--body);letter-spacing:.12em;margin-right:6px;color:var(--muted)}

/* week strip */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.day{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:78px}
.day .dw{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.day .dn{font:700 22px/1.1 var(--display)}
.day .dk{font:600 12px/1 var(--body);color:var(--ink2);font-variant-numeric:tabular-nums}
.day .dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--muted);margin-top:3px}
.day.part .dot{background:linear-gradient(90deg,var(--green) 50%,transparent 50%);border-color:var(--green)}
.day.full .dot{background:var(--green);border-color:var(--green)}
.day.today .dn{color:var(--green)}
.day.sel{background:var(--ink);border-color:var(--ink)}
.day.sel .dw,.day.sel .dk,.day.sel .dn{color:var(--bg)}
.day.sel .dot{border-color:var(--bg)}
.day.sel.full .dot{background:var(--green);border-color:var(--green)}

/* generic */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.lift{box-shadow:var(--shadow)}
.sec{padding-block:20px;border-top:1px solid var(--line)}
.sec>h2,.h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.sub{font-size:14px;color:var(--ink2)}
.muted{color:var(--muted)}
.chip{display:inline-block;font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:6px;background:var(--line2);color:var(--ink2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green-deep)}
.chip.orange{background:var(--orange-soft);color:var(--orange-deep)}
.chip.blue{background:var(--blue-soft);color:var(--blue-deep)}
.chip.violet{background:var(--violet-soft);color:var(--violet-deep)}
.btn{appearance:none;border:0;background:var(--green);color:var(--on-green);font:600 16px/1.2 var(--body);padding:10px 18px;min-height:46px;border-radius:10px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:40px;font-size:14px;padding:6px 12px}
.btn.link{background:none;color:var(--green-deep);padding:0;min-height:0;text-decoration:underline;text-underline-offset:3px;font-weight:500;font-size:14px}
.btn.seg{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:0}
.btn.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.segs{display:flex}
.segs .btn{flex:1}
.segs .btn:first-child{border-radius:10px 0 0 10px}
.segs .btn:last-child{border-radius:0 10px 10px 0;border-left:0}
.banner{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--ink2);margin-bottom:14px}
.banner b{color:var(--ink)}

/* next-up card */
.next{padding:16px}
.next .row{display:flex;align-items:flex-start;gap:12px}
.next .nt{font:700 26px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:2px 0 4px}
.next p{font-size:14.5px;color:var(--ink2)}
.next .act{margin-top:12px}

/* water */
.water{padding:16px;margin-top:12px}
.wtop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wnum{font:700 40px/1 var(--display);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.wnum small{font:600 16px/1 var(--display);color:var(--muted);letter-spacing:.04em}
.wbtns{display:flex;gap:8px}
.bar{position:relative;height:14px;border-radius:7px;background:var(--water-soft);margin:14px 0 10px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--water);border-radius:7px;transition:width .25s}
.wcps{display:flex;flex-wrap:wrap;gap:6px}
.wcps .chip{background:var(--line2)}
.wcps .chip.on{background:var(--water-soft);color:var(--water)}

/* timeline */
.tl{margin-top:16px}
.tl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:8px}
.tl-head h2{font:700 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em}
.blk{display:grid;grid-template-columns:48px 34px minmax(0,1fr) 46px;gap:10px;align-items:start;padding:12px 12px;border-top:1px solid var(--line2)}
.blk:first-child{border-top:0}
.blk.now{background:var(--green-soft)}
.blk.info{opacity:.9}
.tm{font:700 18px/1.2 var(--display);font-variant-numeric:tabular-nums;padding-top:6px;letter-spacing:.02em}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.c-body{background:var(--green-soft);color:var(--green-deep)}
.c-food{background:var(--orange-soft);color:var(--orange-deep)}
.c-mind{background:var(--blue-soft);color:var(--blue-deep)}
.c-rest{background:var(--violet-soft);color:var(--violet-deep)}
.bt{font:600 16px/1.25 var(--body)}
.blk.done .bt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.bd{font-size:14px;color:var(--ink2);margin-top:2px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.meta .btn.link{font-size:12.5px}
.more{font-size:14px;color:var(--ink2);margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:10px}
.tick{appearance:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--on-green)}
.tick svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.tick[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.tick[aria-pressed="true"] svg{opacity:1}
.auto{width:44px;height:44px;border-radius:12px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--on-green)}
.auto svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.auto.on{background:var(--water);border:1.5px solid var(--water)}
.auto.on svg{opacity:1}
.dur{font-variant-numeric:tabular-nums}

/* day bar */
.dbar{margin:12px 0 0}
.dbar svg{width:100%;height:auto;display:block;overflow:visible}
.ax{fill:var(--muted);font:500 11px var(--body)}
.lb{fill:var(--ink2);font:600 11px var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin:8px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}

/* sleep panel */
.sleep{padding:16px;margin-top:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field.full{grid-column:1/-1}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:0 10px;width:100%}
.sres{display:flex;align-items:center;gap:10px;margin-top:12px}
.sres b{font:700 26px/1 var(--display);letter-spacing:.02em}

/* content */
.h3{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin:2px 0 14px}
.stat div{display:flex;flex-direction:column;gap:4px}
.stat b{font:700 30px/1 var(--display);letter-spacing:.01em}
.stat span{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.list li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.list li:first-child{border-top:0}
.l1{font-weight:600}
.l2{font-size:14px;color:var(--ink2)}
.rules li{padding:12px 0;border-top:1px solid var(--line2);font-size:15px}
.rules li:first-child{border-top:0}
.rules b{display:block;margin-bottom:2px}
.rules span{color:var(--ink2);font-size:14.5px}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line2);font-size:15px}
.steps li:first-child{border-top:0}
.steps .n{font:700 22px/1 var(--display);color:var(--green)}
.steps span{display:block;color:var(--ink2);font-size:14px}
.dots li{padding:6px 0 6px 16px;position:relative;font-size:14.5px;color:var(--ink2)}
.dots li::before{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.dots li b{color:var(--ink)}
.dots.no li::before{background:var(--orange)}
.acc{border-top:1px solid var(--line2);padding:2px 0}
.acc summary{cursor:pointer;font-weight:600;padding:12px 0;list-style:none;display:flex;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";color:var(--muted);font-weight:500}
.acc[open] summary::after{content:"\2013"}
.acc .bd2{padding:0 0 12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line2);vertical-align:top}
th{font:600 11.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0;white-space:nowrap}
tr.cur td{background:var(--green-soft)}
td.n{white-space:nowrap}
.mt{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line2)}
.mt:first-child{border-top:0}
.mt .t{font:700 20px/1.1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mt span{display:block;color:var(--ink2);font-size:14px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.note{font-size:13.5px;color:var(--ink2);margin-top:8px}
details.tbl{margin-top:10px;font-size:14px}
details.tbl summary{cursor:pointer;color:var(--green-deep);font-weight:500}
details.tbl .tw{margin-top:8px}
.sync{font-size:13px;color:var(--muted)}
.empty{font-size:14.5px;color:var(--ink2);padding:6px 0}

/* chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:640px}
.tabs button{appearance:none;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:600 11.5px/1 var(--body);letter-spacing:.04em;min-height:56px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--green)}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12.5px;line-height:1.3;max-width:230px;opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:min(92vw,420px);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:25;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.top h1{font-size:32px}.form{grid-template-columns:1fr}.blk{grid-template-columns:44px 30px minmax(0,1fr) 44px;gap:8px;padding-inline:8px}}

textarea{padding:10px;min-height:96px;resize:vertical}
html{background:var(--bg)}
body{padding-top:env(safe-area-inset-top,0px);-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Main"><div class="in" id="tabs">
  <button data-tab="today" aria-label="Today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M9 15l2 2 4-4"/></svg>Today</button>
  <button data-tab="eat" aria-label="Eat"><svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 0 0 2 2v8M10 3v8M8 3v8M17 3c-2 2-2 6 0 8v10"/></svg>Eat</button>
  <button data-tab="skin" aria-label="Skin"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16v4M17 18h4"/></svg>Skin</button>
  <button data-tab="week" aria-label="Week"><svg viewBox="0 0 24 24"><path d="M4 4v16h16M8 15l4-4 3 3 5-6"/></svg>Week</button>
</div></nav>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ========== helpers ========== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((pdate(a)-pdate(b))/864e5);
const today=()=>ymd(new Date());
const mondayOf=s=>addDays(s,-((pdate(s).getDay()+6)%7));
const sundayOf=s=>addDays(s,-pdate(s).getDay());
const fmtDate=s=>{const d=pdate(s);return DOW3[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const tmin=s=>{const p=String(s||'').split(':');return (+p[0])*60+(+p[1]||0)};
const fmtL=ml=>(ml/1000).toFixed(ml%1000===0?1:2).replace(/0$/,'').replace(/\.$/,'.0')+' L';
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
function fmtDurMin(m){const h=Math.floor(m/60),r=m%60;return h?(r?h+' h '+r+' min':h+' h'):r+' min'}

/* ========== icons ========== */
const ICON={
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

function defaultState(){
  const t=today();
  return {v:1,t:0,
    settings:{weight:null,height:null,waterL:null,skin:'unsure',wkStart:'2026-09-21'},
    days:{}};
}
function normalize(s){
  const d=defaultState();
  if(!s||typeof s!=='object')return d;
  return {v:1,t:+s.t||0,settings:Object.assign(d.settings,s.settings||{}),days:(s.days&&typeof s.days==='object')?s.days:{}};
}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LSK))}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(state))}catch(e){}}
function prune(){
  const cut=addDays(today(),-200);
  Object.keys(state.days).forEach(k=>{if(k<cut)delete state.days[k]});
}
let writing=false,dirty=false;
function persist(){prune();state.t=Date.now();saveLocal();flush()}
async function flush(){
  if(!dbRef)return;
  if(writing){dirty=true;return}
  writing=true;
  try{
    do{dirty=false;await dbRef.set(JSON.parse(JSON.stringify(state)))}while(dirty);
    syncNote='synced';
  }catch(e){syncNote='error'}
  writing=false;paintSync();
}
function editing(){const a=document.activeElement;return !!(a&&a.matches&&a.matches('input,select,textarea'))}
async function initDb(){
  let db=null;
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){db=null}
  if(!db){syncNote='local';paintSync();return}
  try{
    dbRef=db.doc('app/state');
    dbRef.onSnapshot(snap=>{
      if(snap.exists){
        const r=normalize(snap.data());
        if(r.t>state.t){state=r;saveLocal();syncNote='synced';if(!editing())render()}
        else if(r.t<state.t){flush()}
        else{syncNote='synced'}
      }else if(state.t>0){flush()}
      else{syncNote='synced'}
      paintSync();
    },()=>{syncNote='error';paintSync()});
  }catch(e){dbRef=null;syncNote='local';paintSync()}
}
function paintSync(){
  const el=$('#sync');if(!el)return;
  el.textContent=syncNote==='synced'?'Saved to your Claude account, so it follows you across devices.':syncNote==='error'?'Could not reach your Claude account just now. Changes are kept on this device and will retry.':'Saved on this phone. Use Backup below to move it to another device.';
}

const SAT_MIN=[35,42,45,30,44,48,52,35,60,65,70,35];
const WED_MIN=[0,0,0,0,25,30,30,20,30,35,35,25];
function workoutFor(date){
  const dow=pdate(date).getDay();
  const n=Math.floor(diffDays(mondayOf(date),mondayOf(state.settings.wkStart))/7)+1;
  const w=Math.min(Math.max(n,1),12),ph=w<=4?1:w<=8?2:3;
  let kind='rest',min=0;
  if(dow===2)kind='A';
  else if(dow===4)kind='B';
  else if(dow===6){kind='long';min=SAT_MIN[w-1]}
  else if(dow===3&&ph>=2){kind='easy';min=WED_MIN[w-1]}
  else if(dow===0&&ph===3)kind='C';
  return {dow,n,w,ph,kind,min};
}
function waterGoal(){
  const s=state.settings;
  if(+s.waterL>0)return Math.max(1000,Math.round(+s.waterL*1000/250)*250);
  if(+s.weight>0)return Math.min(4000,Math.max(2000,Math.round(+s.weight*35/250)*250));
  return 2500;
}
const proteinGoal=()=>+state.settings.weight>0?Math.round(+state.settings.weight*1.6):null;

const isDone=(b,st)=>b.auto?(st.water||0)>=b.wcp:!!(st.done&&st.done[b.id]);
const shown=(P,st)=>P.blocks.filter(b=>!st.min||b.core||b.info);
function dayScore(date){
  const P=planDay(date),st=dayOf(date),list=shown(P,st).filter(b=>!b.info);
  if(!list.length)return {done:0,total:0,pct:0};
  const done=list.filter(b=>isDone(b,st)).length;
  return {done,total:list.length,pct:Math.round(done/list.length*100)};
}
function sleepHours(sl){
  if(!sl||!sl.bed||!sl.wake)return null;
  return ((tmin(sl.wake)-tmin(sl.bed)+1440)%1440)/60;
}

function dayBar(P){
  const W=360,H=26,X=m=>m/1440*W;
  const wake=P.blocks[0].t,bed=P.sleepAt;
  let s='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="5" fill="var(--line2)"/>';
  s+='<rect x="0" y="0" width="'+X(wake)+'" height="'+H+'" fill="var(--muted)" opacity=".35"/><rect x="'+X(bed)+'" y="0" width="'+(W-X(bed))+'" height="'+H+'" fill="var(--muted)" opacity=".35"/>';
  const wk=P.blocks.find(b=>b.id==='work');
  if(wk)s+='<rect x="'+X(wk.t)+'" y="0" width="'+X(wk.dur)+'" height="'+H+'" fill="var(--muted)" opacity=".18"/>';
  P.blocks.filter(b=>!b.info&&b.dur>0).forEach(b=>{
    s+='<rect x="'+X(b.t)+'" y="4" width="'+Math.max(1.5,X(b.dur)-1)+'" height="'+(H-8)+'" rx="2" fill="'+CATC[TY[b.ty][1]]+'"/>';
  });
  [0,6,12,18,24].forEach(h=>{s+='<text class="ax" x="'+Math.min(W-8,Math.max(6,X(h*60)))+'" y="'+(H+14)+'" text-anchor="'+(h===0?'start':h===24?'end':'middle')+'">'+(h===24?'24':pad(h))+'</text>'});
  const legend=Object.keys(CATL).map(k=>'<span><i class="sw" style="background:'+CATC[k]+'"></i>'+CATL[k]+'</span>').join('')+'<span><i class="sw" style="background:var(--muted);opacity:.4"></i>Sleep and work</span>';
  return '<div class="dbar"><svg viewBox="0 0 '+W+' '+(H+18)+'" role="img" aria-label="The day from midnight to midnight: sleep until '+hm(wake)+', the routine blocks in colour, sleep again from '+hm(bed)+'.">'+s+'</svg><div class="legend">'+legend+'</div></div>';
}

function blockRow(b,st,vd,curId){
  const done=isDone(b,st),t=TY[b.ty],open=!!ui.open[vd+b.id];
  const time='<div class="tm">'+hm(b.t)+'</div>';
  const ic='<div class="ico c-'+t[1]+'">'+svg(t[0])+'</div>';
  let ctl='';
  if(b.info)ctl='<span></span>';
  else if(b.auto)ctl='<span class="auto'+(done?' on':'')+'" role="img" aria-label="'+(done?'Reached':'Not reached yet')+'">'+svg('check')+'</span>';
  else ctl='<button class="tick" data-act="chk" data-id="'+b.id+'" aria-pressed="'+(done?'true':'false')+'" aria-label="Mark '+esc(b.title)+' done">'+svg('check')+'</button>';
  const meta=[];
  if(b.dur>0&&!b.info)meta.push('<span class="dur">'+fmtDurMin(b.dur)+'</span>');
  meta.push('<span class="chip '+({body:'green',food:'orange',mind:'blue',rest:'violet'}[t[1]])+'">'+CATL[t[1]]+'</span>');
  if(b.id===curId)meta.unshift('<span class="chip green">Now</span>');
  if(b.more)meta.push('<button class="btn link" data-act="exp" data-key="'+vd+b.id+'" aria-expanded="'+(open?'true':'false')+'">'+(open?'Hide tips':'Tips')+'</button>');
  return '<li class="blk'+(done?' done':'')+(b.id===curId?' now':'')+(b.info?' info':'')+'">'+time+ic+'<div><div class="bt">'+esc(b.title)+'</div><div class="bd">'+esc(b.det)+'</div><div class="meta">'+meta.join('')+'</div>'+(open&&b.more?'<div class="more">'+esc(b.more)+'</div>':'')+'</div>'+ctl+'</li>';
}

function vToday(){
  const t=today(),vd=viewDate(),d=pdate(vd),P=planDay(vd),st=dayOf(vd),sc=dayScore(vd);
  const sun=sundayOf(vd);
  const strip=[0,1,2,3,4,5,6].map(i=>{
    const dt=addDays(sun,i),s2=dayScore(dt),has=!!state.days[dt];
    const cls=(dt===vd?' sel':'')+(dt===t?' today':'')+(has&&s2.pct>=70?' full':has&&s2.pct>0?' part':'');
    return '<button class="day'+cls+'" data-act="day" data-date="'+dt+'" aria-label="'+fmtDate(dt)+(has?', '+s2.pct+' percent done':'')+'"><span class="dw">'+DOW3[i]+'</span><span class="dn">'+pdate(dt).getDate()+'</span><span class="dk">'+(has?s2.pct+'%':(i<=4?'Work':'Off'))+'</span><span class="dot"></span></button>';
  }).join('');
  const list=shown(P,st);
  // next up
  let cur=null,nextCard='';
  if(vd===t){
    const nm=nowMin();
    cur=list.find(b=>!b.info&&!isDone(b,st)&&b.t+Math.max(b.dur,5)>=nm)||null;
    if(cur){
      const isNow=cur.t<=nm,tt=TY[cur.ty];

/* ---- Week ---- */
function chartDays(){
  const t=today(),D=[];
  for(let i=13;i>=0;i--){const dt=addDays(t,-i);D.push({dt,has:!!state.days[dt],pct:dayScore(dt).pct})}
  const W=360,H=190,ml=28,mr=6,mt=12,mb=26,iw=W-ml-mr,ih=H-mt-mb,band=iw/D.length,bw=Math.min(18,band*.6),Y=v=>mt+ih-v/100*ih;
  let s='';
  [0,50,100].forEach(v=>{s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line2)"/><text class="ax" x="'+(ml-6)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(70)+'" y2="'+Y(70)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 3"/>';
  D.forEach((d,i)=>{
    const x=ml+band*i+(band-bw)/2;
    if(d.has&&d.pct>0)s+='<rect x="'+x+'" y="'+Y(d.pct)+'" width="'+bw+'" height="'+(d.pct/100*ih)+'" rx="3" fill="'+(d.pct>=70?'var(--green)':'var(--orange)')+'"/>';
    else s+='<rect x="'+x+'" y="'+(Y(0)-2)+'" width="'+bw+'" height="2" rx="1" fill="var(--line)"/>';
    s+='<text class="'+(d.dt===t?'lb':'ax')+'" x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+pdate(d.dt).getDate()+'</text>';
    s+='<rect x="'+(ml+band*i)+'" y="'+mt+'" width="'+band+'" height="'+ih+'" fill="transparent" data-tip="'+fmtDate(d.dt)+': '+(d.has?d.pct+'% done':'not logged')+'"/>';
  });
  const tbl='<details class="tbl"><summary>View as table</summary><div class="tw"><table><thead><tr><th>Day</th><th>Done</th></tr></thead><tbody>'+D.slice().reverse().map(d=>'<tr><td class="n">'+fmtDate(d.dt)+'</td><td class="n">'+(d.has?d.pct+'%':'–')+'</td></tr>').join('')+'</tbody></table></div></details>';
  return '<div class="legend" style="margin:0 0 8px"><span><i class="sw" style="background:var(--green)"></i>70% or more</span><span><i class="sw" style="background:var(--orange)"></i>Under 70%</span><span>Dashed line: 70% target</span></div><div class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Share of the daily routine completed for each of the last 14 days, with a 70 percent target line">'+s+'</svg></div>'+tbl;
}
function streak(){
  let n=0,d=today();
  if(!state.days[d]||dayScore(d).pct<70)d=addDays(d,-1);
  for(let i=0;i<365;i++){
    if(state.days[d]&&dayScore(d).pct>=70){n++;d=addDays(d,-1)}else break;
  }
  return n;
}
function bmiNote(){
  const s=state.settings;
  if(!(+s.weight>0&&+s.height>0))return '<p class="note">Add your height and weight to see your BMI.</p>';
  const h=+s.height/100,bmi=+s.weight/(h*h);
  return '<p class="note"><b>BMI '+bmi.toFixed(1)+'.</b> A rough guide only: muscle adds weight, so judge progress by how your clothes fit, your energy and your workouts too.</p>';
}

  const settings='<section class="sec"><h2>Settings</h2><div class="form"><div class="field"><label for="s_w">Weight, kg</label><input id="s_w" type="number" inputmode="decimal" min="30" max="250" placeholder="optional" value="'+(s.weight||'')+'"></div><div class="field"><label for="s_h">Height, cm</label><input id="s_h" type="number" inputmode="decimal" min="100" max="250" placeholder="optional" value="'+(s.height||'')+'"></div><div class="field"><label for="s_wl">Water goal, litres</label><input id="s_wl" type="number" inputmode="decimal" step="0.25" min="1" max="6" placeholder="auto: '+(g/1000)+'" value="'+(s.waterL||'')+'"></div><div class="field"><label for="s_st">Workout start date</label><input id="s_st" type="date" value="'+esc(s.wkStart)+'"></div><div class="field full"><button class="btn" data-act="saveSettings">Save settings</button></div></div>'+bmiNote()+'<p class="note">Use the same start date as your workout app. It decides when the Wednesday easy run begins (week 5) and when Sunday adds the core circuit (week 9). '+(W.n<1?'Your plan has not started yet.':'You are in week '+W.w+' of 12.')+'</p><p style="margin-top:14px"><button class="btn ghost sm" data-act="clearToday">Clear today’s ticks</button></p><details class="acc" style="margin-top:14px"><summary>Backup and restore</summary><div class="bd2"><p class="sub">Your data lives on this phone. Copy a backup into Notes or Messages, or paste one here to restore it.</p><textarea id="bk" rows="4" aria-label="Backup text" style="margin-top:10px"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" data-act="bkCopy">Copy backup</button><button class="btn sm ghost" data-act="bkRestore">Restore from box</button></div></div></details><p class="sync" id="sync" style="margin-top:10px"></p></section>';

/* ========== render & events ========== */
function render(){
  const y=window.scrollY;
  const v=ui.tab==='eat'?vEat():ui.tab==='skin'?vSkin():ui.tab==='week'?vWeek():vToday();
  $('#app').innerHTML=v;
  document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  paintSync();
  window.scrollTo(0,y);
}
let toastT=null;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200)}

document.addEventListener('click',e=>{
  const tb=e.target.closest('#tabs button');
  if(tb){ui.tab=tb.dataset.tab;try{localStorage.setItem(LST,ui.tab)}catch(er){}render();window.scrollTo(0,0);return}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,vd=viewDate();
  if(a==='day'){ui.viewDate=t.dataset.date;render()}
  else if(a==='todayBtn'){ui.viewDate=null;render()}
  else if(a==='chk'){
    const x=ensureDay(vd),id=t.dataset.id;
    if(x.done[id])delete x.done[id];else x.done[id]=1;
    persist();render();
  }
  else if(a==='exp'){ui.open[t.dataset.key]=!ui.open[t.dataset.key];render()}
  else if(a==='water'){
    const x=ensureDay(vd),g=waterGoal(),before=x.water||0;
    x.water=Math.max(0,Math.min(6000,before+ +t.dataset.ml));
    persist();render();
    if(before<g&&x.water>=g)toast('Water goal reached. Nicely done.');
  }
  else if(a==='mode'){ensureDay(vd).min=+t.dataset.v;persist();render()}
  else if(a==='clearToday'){delete state.days[vd];persist();render();toast('Cleared '+fmtDate(vd))}
  else if(a==='saveSettings'){
    const w=parseFloat($('#s_w').value),h=parseFloat($('#s_h').value),wl=parseFloat($('#s_wl').value),st=$('#s_st').value;
    state.settings.weight=w>0?w:null;state.settings.height=(h>=100&&h<=250)?h:null;state.settings.waterL=wl>0?wl:null;
    if(st)state.settings.wkStart=st;
    persist();render();toast('Settings saved');
  }
  else if(a==='bkCopy'){
    const ta=$('#bk');ta.value=JSON.stringify(state);ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    let ok=false;try{ok=document.execCommand('copy')}catch(er){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>toast('Backup copied'),()=>toast('Select the text and copy it'));return}
    toast(ok?'Backup copied':'Select the text and copy it');
  }
  else if(a==='bkRestore'){
    try{
      const r=JSON.parse($('#bk').value);
      if(!r||typeof r!=='object'||!r.days)throw new Error('bad');
      state=normalize(r);persist();render();toast('Backup restored');
    }catch(er){toast('That does not look like a backup')}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='sk_type'){state.settings.skin=el.value;persist();render()}
  else if(el.id==='sl_bed'||el.id==='sl_wake'){
    const x=ensureDay(viewDate()),cur=x.sleep||{bed:'23:00',wake:'07:00'};
    x.sleep={bed:$('#sl_bed').value||cur.bed,wake:$('#sl_wake').value||cur.wake};
    persist();render();
  }
});
/* tooltips */
const tip=$('#tip');
document.addEventListener('pointerover',e=>{
  const el=e.target.closest&&e.target.closest('[data-tip]');
  if(!el){tip.style.opacity=0;return}
  tip.textContent=el.getAttribute('data-tip');
  const r=el.getBoundingClientRect();
  tip.style.opacity=1;
  tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,r.left+r.width/2-tip.offsetWidth/2))+'px';
  tip.style.top=Math.max(8,r.top-tip.offsetHeight-6)+'px';
});
window.addEventListener('scroll',()=>{tip.style.opacity=0},{passive:true});

/* ========== boot ========== */
state=normalize(loadLocal());
try{const sv=localStorage.getItem(LST);if(sv&&['today','eat','skin','week'].includes(sv))ui.tab=sv}catch(e){}
render();
initDb();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editing())render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
</body>
</html>
